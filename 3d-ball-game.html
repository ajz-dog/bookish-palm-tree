<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限 3D 球体游走 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #info p {
            font-size: 14px;
            opacity: 0.8;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #controls span {
            margin: 0 15px;
            font-size: 14px;
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🚀 无限 3D 空间</h1>
        <p>球体在无限延伸的空间中游走</p>
    </div>
    <div id="canvas-container"></div>
    <div id="controls">
        <span>🖱️ 拖动旋转视角</span>
        <span>📱 滚轮缩放</span>
    </div>
    <div id="stats">
        <div>物体数量: <span id="object-count">0</span></div>
        <div>位置 Z: <span id="position-z">0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, ball, controls;
        let velocity = new THREE.Vector3();
        let target = new THREE.Vector3();
        const speed = 0.15;
        
        const RENDER_DISTANCE = 100;
        const CHUNK_SIZE = 20;
        const activeChunks = new Map();
        const allObjects = [];
        
        let objectCountElement, positionZElement;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 50, RENDER_DISTANCE);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 60;
            controls.target.set(0, 0, 0);

            objectCountElement = document.getElementById('object-count');
            positionZElement = document.getElementById('position-z');

            setupLighting();
            createBall();
            setNewTarget();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            scene.add(directionalLight);
        }

        function createBall() {
            const geometry = new THREE.SphereGeometry(1.5, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x00ffff,
                metalness: 0.3,
                roughness: 0.2,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: 0x00ffff,
                emissiveIntensity: 0.3
            });
            ball = new THREE.Mesh(geometry, material);
            scene.add(ball);

            const glowGeometry = new THREE.SphereGeometry(2, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.1
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            ball.add(glow);
        }

        function getChunkKey(x, z) {
            return `${Math.floor(x / CHUNK_SIZE)},${Math.floor(z / CHUNK_SIZE)}`;
        }

        function createChunkContent(chunkX, chunkZ) {
            const objects = [];
            const baseX = chunkX * CHUNK_SIZE;
            const baseZ = chunkZ * CHUNK_SIZE;

            const numBoxes = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < numBoxes; i++) {
                const size = Math.random() * 2 + 0.5;
                const geometry = new THREE.BoxGeometry(size, size, size);
                const hue = Math.random();
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, 0.8, 0.5),
                    metalness: 0.5,
                    roughness: 0.5
                });
                const box = new THREE.Mesh(geometry, material);
                box.position.set(
                    baseX + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2,
                    Math.random() * 10 - 5,
                    baseZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2
                );
                box.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                box.userData.isChunkObject = true;
                objects.push(box);
                scene.add(box);
                allObjects.push(box);
            }

            const numPyramids = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < numPyramids; i++) {
                const geometry = new THREE.ConeGeometry(1, 2, 4);
                const hue = Math.random();
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, 0.8, 0.6),
                    metalness: 0.3,
                    roughness: 0.7
                });
                const pyramid = new THREE.Mesh(geometry, material);
                pyramid.position.set(
                    baseX + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2,
                    Math.random() * 10 - 5,
                    baseZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2
                );
                pyramid.rotation.y = Math.random() * Math.PI;
                pyramid.userData.isChunkObject = true;
                objects.push(pyramid);
                scene.add(pyramid);
                allObjects.push(pyramid);
            }

            const numOctahedrons = Math.floor(Math.random() * 2);
            for (let i = 0; i < numOctahedrons; i++) {
                const geometry = new THREE.OctahedronGeometry(0.8);
                const hue = Math.random();
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, 0.9, 0.5),
                    metalness: 0.7,
                    roughness: 0.3
                });
                const octahedron = new THREE.Mesh(geometry, material);
                octahedron.position.set(
                    baseX + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2,
                    Math.random() * 10 - 5,
                    baseZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2
                );
                octahedron.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                octahedron.userData.isChunkObject = true;
                objects.push(octahedron);
                scene.add(octahedron);
                allObjects.push(octahedron);
            }

            return objects;
        }

        function updateChunks() {
            const ballChunkX = Math.floor(ball.position.x / CHUNK_SIZE);
            const ballChunkZ = Math.floor(ball.position.z / CHUNK_SIZE);
            const viewDistance = Math.ceil(RENDER_DISTANCE / CHUNK_SIZE);

            const neededChunks = new Set();
            for (let dx = -viewDistance; dx <= viewDistance; dx++) {
                for (let dz = -viewDistance; dz <= viewDistance; dz++) {
                    const cx = ballChunkX + dx;
                    const cz = ballChunkZ + dz;
                    const key = `${cx},${cz}`;
                    neededChunks.add(key);

                    if (!activeChunks.has(key)) {
                        const objects = createChunkContent(cx, cz);
                        activeChunks.set(key, objects);
                    }
                }
            }

            for (const [key, objects] of activeChunks) {
                if (!neededChunks.has(key)) {
                    for (const obj of objects) {
                        scene.remove(obj);
                        const index = allObjects.indexOf(obj);
                        if (index > -1) {
                            allObjects.splice(index, 1);
                        }
                        if (obj.geometry) obj.geometry.dispose();
                        if (obj.material) {
                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(m => m.dispose());
                            } else {
                                obj.material.dispose();
                            }
                        }
                    }
                    activeChunks.delete(key);
                }
            }

            objectCountElement.textContent = allObjects.length;
        }

        function setNewTarget() {
            target.x = (Math.random() - 0.5) * 200;
            target.y = (Math.random() - 0.5) * 40;
            target.z = (Math.random() - 0.5) * 200;
        }

        function updateBall() {
            const direction = new THREE.Vector3().subVectors(target, ball.position).normalize();
            velocity.lerp(direction.multiplyScalar(speed), 0.02);
            ball.position.add(velocity);
            ball.rotation.x += velocity.z * 0.3;
            ball.rotation.z -= velocity.x * 0.3;

            const distance = ball.position.distanceTo(target);
            if (distance < 5) {
                setNewTarget();
            }

            const hue = (Date.now() * 0.0005) % 1;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            ball.material.color = color;
            ball.material.emissive = color;

            positionZElement.textContent = Math.round(ball.position.z);

            camera.position.x = ball.position.x;
            camera.position.y = ball.position.y + 5;
            camera.position.z = ball.position.z + 18;
            controls.target.set(ball.position.x, ball.position.y, ball.position.z);
        }

        function animateObjects() {
            const time = Date.now() * 0.001;
            for (const obj of allObjects) {
                if (obj.userData.isChunkObject) {
                    obj.rotation.x += 0.005;
                    obj.rotation.y += 0.003;
                    obj.position.y += Math.sin(time + obj.position.x) * 0.002;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let chunkUpdateTimer = 0;
        function animate() {
            requestAnimationFrame(animate);
            updateBall();
            animateObjects();
            
            chunkUpdateTimer++;
            if (chunkUpdateTimer >= 10) {
                updateChunks();
                chunkUpdateTimer = 0;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
