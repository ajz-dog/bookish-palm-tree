<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 球体游走 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #info p {
            font-size: 14px;
            opacity: 0.8;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #controls span {
            margin: 0 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🎮 3D 球体游走</h1>
        <p>观看球体在 3D 空间中自由游走</p>
    </div>
    <div id="canvas-container"></div>
    <div id="controls">
        <span>🖱️ 拖动旋转视角</span>
        <span>📱 滚轮缩放</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, ball, controls;
        let velocity = new THREE.Vector3();
        let target = new THREE.Vector3();
        const speed = 0.05;
        const boundary = 8;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 30;

            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x00ffff, 1, 50);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff00ff, 1, 50);
            pointLight2.position.set(-10, 5, -10);
            scene.add(pointLight2);

            const pointLight3 = new THREE.PointLight(0xffff00, 0.8, 50);
            pointLight3.position.set(0, -5, 10);
            scene.add(pointLight3);

            createBoundaryBox();
            createBall();
            createGround();
            createStars();

            setNewTarget();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createBoundaryBox() {
            const boxGeometry = new THREE.BoxGeometry(boundary * 2, boundary * 2, boundary * 2);
            const edges = new THREE.EdgesGeometry(boxGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.3 
            });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            scene.add(wireframe);
        }

        function createBall() {
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x00ff88,
                metalness: 0.3,
                roughness: 0.2,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: 0x00ff88,
                emissiveIntensity: 0.2
            });
            ball = new THREE.Mesh(geometry, material);
            ball.castShadow = true;
            scene.add(ball);

            const glowGeometry = new THREE.SphereGeometry(1.3, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.1
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            ball.add(glow);
        }

        function createGround() {
            const geometry = new THREE.PlaneGeometry(50, 50);
            const material = new THREE.MeshStandardMaterial({
                color: 0x16213e,
                metalness: 0.5,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -boundary - 0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(50, 50, 0x00ffff, 0x00ffff);
            gridHelper.position.y = -boundary - 0.09;
            gridHelper.material.opacity = 0.1;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
        }

        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 1000; i++) {
                vertices.push(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.1,
                transparent: true,
                opacity: 0.8
            });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        function setNewTarget() {
            target.x = (Math.random() - 0.5) * (boundary - 2) * 2;
            target.y = (Math.random() - 0.5) * (boundary - 2) * 2;
            target.z = (Math.random() - 0.5) * (boundary - 2) * 2;
        }

        function updateBall() {
            const direction = new THREE.Vector3().subVectors(target, ball.position).normalize();
            velocity.lerp(direction.multiplyScalar(speed), 0.05);
            ball.position.add(velocity);
            ball.rotation.x += velocity.z * 0.5;
            ball.rotation.z -= velocity.x * 0.5;

            const distance = ball.position.distanceTo(target);
            if (distance < 1) {
                setNewTarget();
            }

            for (let axis of ['x', 'y', 'z']) {
                if (Math.abs(ball.position[axis]) > boundary - 1) {
                    velocity[axis] *= -0.8;
                    ball.position[axis] = Math.sign(ball.position[axis]) * (boundary - 1);
                }
            }

            const hue = (Date.now() * 0.001) % 1;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            ball.material.color = color;
            ball.material.emissive = color;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateBall();
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
