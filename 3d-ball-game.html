<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限跑道 3D Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #info p {
            font-size: 14px;
            opacity: 0.8;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #controls span {
            margin: 0 15px;
            font-size: 14px;
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🏃 无限跑道</h1>
        <p>球体在无限延伸的跑道上前进</p>
    </div>
    <div id="canvas-container"></div>
    <div id="controls">
        <span>🖱️ 拖动旋转视角</span>
        <span>📱 滚轮缩放</span>
    </div>
    <div id="stats">
        <div>物体数量: <span id="object-count">0</span></div>
        <div>前进距离: <span id="distance">0</span></div>
        <div>速度: <span id="speed">0.0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, ball, controls;
        const FORWARD_SPEED = 0.3;
        const TRACK_WIDTH = 15;
        const TRACK_SEGMENT_LENGTH = 30;
        const RENDER_DISTANCE_FORWARD = 200;
        const RENDER_DISTANCE_BACKWARD = 50;
        
        const activeSegments = new Map();
        const allObjects = [];
        let currentZ = 0;
        
        let objectCountElement, distanceElement, speedElement;
        const keys = {};
        const PLAYER_SPEED = 0.2;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 50, RENDER_DISTANCE_FORWARD);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 80;
            controls.target.set(0, 2, 0);

            objectCountElement = document.getElementById('object-count');
            distanceElement = document.getElementById('distance');
            speedElement = document.getElementById('speed');

            setupLighting();
            createBall();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 50, 30);
            scene.add(directionalLight);

            const pointLight1 = new THREE.PointLight(0x00ffff, 0.6, 100);
            pointLight1.position.set(-TRACK_WIDTH / 2 - 5, 5, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff00ff, 0.6, 100);
            pointLight2.position.set(TRACK_WIDTH / 2 + 5, 5, 0);
            scene.add(pointLight2);
        }

        function createBall() {
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x00ffff,
                metalness: 0.3,
                roughness: 0.2,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: 0x00ffff,
                emissiveIntensity: 0.3
            });
            ball = new THREE.Mesh(geometry, material);
            ball.position.y = 2;
            scene.add(ball);

            const glowGeometry = new THREE.SphereGeometry(1.6, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.1
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            ball.add(glow);
        }

        function getSegmentKey(z) {
            return Math.floor(z / TRACK_SEGMENT_LENGTH);
        }

        function createTrackSegment(segmentIndex) {
            const objects = [];
            const segmentZ = segmentIndex * TRACK_SEGMENT_LENGTH;

            const trackGeometry = new THREE.BoxGeometry(TRACK_WIDTH, 0.5, TRACK_SEGMENT_LENGTH);
            const trackMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a4a,
                metalness: 0.3,
                roughness: 0.8
            });
            const track = new THREE.Mesh(trackGeometry, trackMaterial);
            track.position.set(0, -0.25, segmentZ + TRACK_SEGMENT_LENGTH / 2);
            track.userData.isSegmentObject = true;
            objects.push(track);
            scene.add(track);
            allObjects.push(track);

            const gridGeometry = new THREE.PlaneGeometry(TRACK_WIDTH, TRACK_SEGMENT_LENGTH, 10, 5);
            const gridMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.1,
                wireframe: true
            });
            const grid = new THREE.Mesh(gridGeometry, gridMaterial);
            grid.rotation.x = -Math.PI / 2;
            grid.position.set(0, 0.01, segmentZ + TRACK_SEGMENT_LENGTH / 2);
            grid.userData.isSegmentObject = true;
            objects.push(grid);
            scene.add(grid);
            allObjects.push(grid);

            for (let side = -1; side <= 1; side += 2) {
                const sideLineGeometry = new THREE.BoxGeometry(0.3, 0.8, TRACK_SEGMENT_LENGTH);
                const sideLineMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffff00,
                    emissive: 0xffff00,
                    emissiveIntensity: 0.3
                });
                const sideLine = new THREE.Mesh(sideLineGeometry, sideLineMaterial);
                sideLine.position.set(side * TRACK_WIDTH / 2, 0.4, segmentZ + TRACK_SEGMENT_LENGTH / 2);
                sideLine.userData.isSegmentObject = true;
                objects.push(sideLine);
                scene.add(sideLine);
                allObjects.push(sideLine);
            }

            const numObstacles = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < numObstacles; i++) {
                const obstacleType = Math.random();
                let obstacle;
                
                if (obstacleType < 0.4) {
                    const boxGeometry = new THREE.BoxGeometry(2, 2, 2);
                    const hue = Math.random();
                    const boxMaterial = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(hue, 0.8, 0.5),
                        metalness: 0.5,
                        roughness: 0.5
                    });
                    obstacle = new THREE.Mesh(boxGeometry, boxMaterial);
                } else if (obstacleType < 0.7) {
                    const coneGeometry = new THREE.ConeGeometry(1.5, 3, 6);
                    const hue = Math.random();
                    const coneMaterial = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(hue, 0.8, 0.6),
                        metalness: 0.3,
                        roughness: 0.7
                    });
                    obstacle = new THREE.Mesh(coneGeometry, coneMaterial);
                } else {
                    const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 3, 12);
                    const hue = Math.random();
                    const cylinderMaterial = new THREE.MeshStandardMaterial({
                        color: new THREE.Color().setHSL(hue, 0.9, 0.5),
                        metalness: 0.6,
                        roughness: 0.4
                    });
                    obstacle = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
                }

                obstacle.position.set(
                    (Math.random() - 0.5) * (TRACK_WIDTH - 6),
                    obstacle.geometry.parameters.height ? obstacle.geometry.parameters.height / 2 : 1.5,
                    segmentZ + Math.random() * TRACK_SEGMENT_LENGTH
                );
                obstacle.userData.isSegmentObject = true;
                objects.push(obstacle);
                scene.add(obstacle);
                allObjects.push(obstacle);
            }

            const numPillars = 2;
            for (let i = 0; i < numPillars; i++) {
                for (let side = -1; side <= 1; side += 2) {
                    const pillarGeometry = new THREE.CylinderGeometry(0.3, 0.3, 8, 8);
                    const pillarMaterial = new THREE.MeshStandardMaterial({
                        color: 0x444466,
                        metalness: 0.7,
                        roughness: 0.3
                    });
                    const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
                    pillar.position.set(
                        side * (TRACK_WIDTH / 2 + 3),
                        4,
                        segmentZ + (i + 0.5) * (TRACK_SEGMENT_LENGTH / numPillars)
                    );
                    pillar.userData.isSegmentObject = true;
                    objects.push(pillar);
                    scene.add(pillar);
                    allObjects.push(pillar);

                    const lampGeometry = new THREE.SphereGeometry(0.5, 16, 16);
                    const lampMaterial = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.8
                    });
                    const lamp = new THREE.Mesh(lampGeometry, lampMaterial);
                    lamp.position.set(0, 4.5, 0);
                    pillar.add(lamp);
                }
            }

            return objects;
        }

        function updateSegments() {
            const currentSegment = getSegmentKey(currentZ);
            const segmentsNeededForward = Math.ceil(RENDER_DISTANCE_FORWARD / TRACK_SEGMENT_LENGTH);
            const segmentsNeededBackward = Math.ceil(RENDER_DISTANCE_BACKWARD / TRACK_SEGMENT_LENGTH);

            const neededSegments = new Set();
            for (let i = -segmentsNeededBackward; i <= segmentsNeededForward; i++) {
                const segIndex = currentSegment + i;
                neededSegments.add(segIndex);

                if (!activeSegments.has(segIndex)) {
                    const objects = createTrackSegment(segIndex);
                    activeSegments.set(segIndex, objects);
                }
            }

            for (const [segIndex, objects] of activeSegments) {
                if (!neededSegments.has(segIndex)) {
                    for (const obj of objects) {
                        scene.remove(obj);
                        const index = allObjects.indexOf(obj);
                        if (index > -1) {
                            allObjects.splice(index, 1);
                        }
                        if (obj.geometry) obj.geometry.dispose();
                        if (obj.material) {
                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(m => m.dispose());
                            } else {
                                obj.material.dispose();
                            }
                        }
                    }
                    activeSegments.delete(segIndex);
                }
            }

            objectCountElement.textContent = allObjects.length;
        }

        function updateBall() {
            currentZ += FORWARD_SPEED;
            
            ball.position.z = currentZ;
            
            ball.rotation.x += FORWARD_SPEED * 0.5;
            
            const lateralOffset = Math.sin(currentZ * 0.02) * 4;
            let targetX = lateralOffset;
            
            const trackHalfWidth = TRACK_WIDTH / 2 - 1.5;
            targetX = Math.max(-trackHalfWidth, Math.min(trackHalfWidth, targetX));
            
            ball.position.x = targetX;

            const hue = (currentZ * 0.01) % 1;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            ball.material.color = color;
            ball.material.emissive = color;

            distanceElement.textContent = Math.round(currentZ);
            speedElement.textContent = (FORWARD_SPEED * 60).toFixed(1);

            camera.position.x = ball.position.x;
            camera.position.y = 10;
            camera.position.z = ball.position.z - 20;
            controls.target.set(ball.position.x, ball.position.y + 2, ball.position.z);
        }

        function animateObjects() {
            const time = Date.now() * 0.001;
            for (const obj of allObjects) {
                if (obj.userData.isSegmentObject && obj.geometry && 
                    (obj.geometry.type === 'BoxGeometry' || 
                     obj.geometry.type === 'ConeGeometry' || 
                     obj.geometry.type === 'CylinderGeometry')) {
                    if (obj.position.y > 1) {
                        obj.rotation.y += 0.01;
                    }
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let segmentUpdateTimer = 0;
        function animate() {
            requestAnimationFrame(animate);
            updateBall();
            animateObjects();
            
            segmentUpdateTimer++;
            if (segmentUpdateTimer >= 5) {
                updateSegments();
                segmentUpdateTimer = 0;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
