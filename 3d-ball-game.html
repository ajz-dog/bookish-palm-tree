<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 球体游走游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .header {
            padding: 30px;
            text-align: center;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 40px rgba(0, 212, 255, 0.4);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }
        
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 40px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            pointer-events: auto;
        }
        
        .controls-title {
            color: #00d4ff;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .keys {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .key {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
            min-width: 50px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
            transition: all 0.2s ease;
        }
        
        .key:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            border-color: rgba(0, 212, 255, 0.8);
        }
        
        .key.active {
            background: linear-gradient(145deg, #00d4ff, #0099cc);
            transform: translateY(2px);
        }
        
        .stats-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            pointer-events: auto;
        }
        
        .stat-item {
            margin-bottom: 10px;
            color: #fff;
            font-size: 0.9rem;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            margin-right: 10px;
        }
        
        .stat-value {
            color: #00d4ff;
            font-weight: 700;
        }
        
        .speed-bar {
            width: 150px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .speed-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            border-radius: 3px;
            transition: width 0.1s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        
        <div class="ui-overlay">
            <div class="header">
                <h1 class="title">3D 球体游走</h1>
                <p class="subtitle">探索无限空间</p>
            </div>
            
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">位置:</span>
                    <span class="stat-value" id="position">0, 0, 0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">速度:</span>
                    <span class="stat-value" id="speed">0</span>
                </div>
                <div class="speed-bar">
                    <div class="speed-fill" id="speed-fill"></div>
                </div>
            </div>
            
            <div class="controls-panel">
                <div class="controls-title">控制方式</div>
                <div class="keys">
                    <div class="key" id="key-w">W</div>
                    <div class="key" id="key-a">A</div>
                    <div class="key" id="key-s">S</div>
                    <div class="key" id="key-d">D</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let ball, ballLight;
        let velocity = new THREE.Vector3();
        const keys = {};
        const maxSpeed = 0.5;
        const acceleration = 0.015;
        const friction = 0.98;
        let particles = [];
        let trailPositions = [];
        const trailLength = 50;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x1a1a2e, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404080, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            createBall();
            createGrid();
            createParticles();
            createStars();

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createBall() {
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00d4ff,
                metalness: 0.3,
                roughness: 0.2,
                emissive: 0x0066aa,
                emissiveIntensity: 0.3
            });

            ball = new THREE.Mesh(geometry, material);
            ball.castShadow = true;
            ball.receiveShadow = true;
            scene.add(ball);

            ballLight = new THREE.PointLight(0x00d4ff, 2, 30);
            ballLight.castShadow = true;
            ball.add(ballLight);

            const trailGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            for (let i = 0; i < trailLength; i++) {
                const trailMaterial = new THREE.MeshStandardMaterial({
                    color: 0x00d4ff,
                    transparent: true,
                    opacity: 1 - (i / trailLength),
                    emissive: 0x0066aa,
                    emissiveIntensity: 0.5
                });
                const trailBall = new THREE.Mesh(trailGeometry, trailMaterial);
                trailBall.position.set(0, 0, 0);
                trailBall.visible = false;
                scene.add(trailBall);
                trailPositions.push({ mesh: trailBall, pos: new THREE.Vector3(0, 0, 0) });
            }
        }

        function createGrid() {
            const gridSize = 100;
            const gridDivisions = 50;

            const gridHelper = new THREE.GridHelper(gridSize, gridDivisions, 0x00d4ff, 0x004466);
            gridHelper.position.y = -1;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            const groundGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x0a0a1a,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1.01;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createParticles() {
            const particleGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            
            for (let i = 0; i < 30; i++) {
                const hue = Math.random() * 0.2 + 0.5;
                const color = new THREE.Color();
                color.setHSL(hue, 0.8, 0.5);

                const particleMaterial = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    metalness: 0.5,
                    roughness: 0.3
                });

                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.set(
                    (Math.random() - 0.5) * 60,
                    Math.random() * 10 + 2,
                    (Math.random() - 0.5) * 60
                );
                particle.userData = {
                    floatSpeed: Math.random() * 0.02 + 0.01,
                    floatOffset: Math.random() * Math.PI * 2,
                    originalY: particle.position.y
                };
                particle.castShadow = true;
                scene.add(particle);
                particles.push(particle);
            }
        }

        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 200;
                positions[i + 1] = Math.random() * 80 + 10;
                positions[i + 2] = (Math.random() - 0.5) * 200;

                const color = new THREE.Color();
                color.setHSL(Math.random() * 0.2 + 0.5, 0.5, 0.8);
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starMaterial = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        function onKeyDown(event) {
            keys[event.key.toLowerCase()] = true;
            const keyElement = document.getElementById('key-' + event.key.toLowerCase());
            if (keyElement) {
                keyElement.classList.add('active');
            }
        }

        function onKeyUp(event) {
            keys[event.key.toLowerCase()] = false;
            const keyElement = document.getElementById('key-' + event.key.toLowerCase());
            if (keyElement) {
                keyElement.classList.remove('active');
            }
        }

        function updateMovement() {
            const direction = new THREE.Vector3();

            if (keys['w']) direction.z -= 1;
            if (keys['s']) direction.z += 1;
            if (keys['a']) direction.x -= 1;
            if (keys['d']) direction.x += 1;

            if (direction.length() > 0) {
                direction.normalize();
                velocity.x += direction.x * acceleration;
                velocity.z += direction.z * acceleration;
            }

            velocity.multiplyScalar(friction);
            const speed = velocity.length();
            if (speed > maxSpeed) {
                velocity.normalize().multiplyScalar(maxSpeed);
            }

            ball.position.add(velocity);
            ball.rotation.x += velocity.z * 0.5;
            ball.rotation.z -= velocity.x * 0.5;

            for (let i = trailPositions.length - 1; i > 0; i--) {
                trailPositions[i].pos.copy(trailPositions[i - 1].pos);
                trailPositions[i].mesh.position.copy(trailPositions[i].pos);
                trailPositions[i].mesh.visible = true;
            }
            trailPositions[0].pos.copy(ball.position);

            camera.position.x = ball.position.x;
            camera.position.z = ball.position.z + 20;
            camera.lookAt(ball.position);

            updateUI();
        }

        function updateUI() {
            document.getElementById('position').textContent = 
                `${ball.position.x.toFixed(1)}, ${ball.position.y.toFixed(1)}, ${ball.position.z.toFixed(1)}`;
            
            const speed = velocity.length();
            document.getElementById('speed').textContent = (speed * 100).toFixed(0);
            
            const speedPercent = (speed / maxSpeed) * 100;
            document.getElementById('speed-fill').style.width = speedPercent + '%';
        }

        function updateParticles(time) {
            particles.forEach((particle, index) => {
                const userData = particle.userData;
                particle.position.y = userData.originalY + 
                    Math.sin(time * userData.floatSpeed + userData.floatOffset) * 2;
                particle.rotation.y += 0.01;
                particle.rotation.x += 0.005;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();

            updateMovement();
            updateParticles(time);

            const pulseIntensity = 0.3 + Math.sin(time * 0.003) * 0.2;
            ball.material.emissiveIntensity = pulseIntensity;
            ballLight.intensity = 1.5 + Math.sin(time * 0.003) * 0.5;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
