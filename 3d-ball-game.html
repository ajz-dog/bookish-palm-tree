<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限跑道 3D 球体游走 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #info p {
            font-size: 14px;
            opacity: 0.8;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        #controls span {
            margin: 0 15px;
            font-size: 14px;
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>🏃 无限跑道 3D</h1>
        <p>球体在无限延伸的跑道上游走</p>
    </div>
    <div id="canvas-container"></div>
    <div id="controls">
        <span>🖱️ 拖动旋转视角</span>
        <span>📱 滚轮缩放</span>
    </div>
    <div id="stats">
        <div>物体数量: <span id="object-count">0</span></div>
        <div>位置 Z: <span id="position-z">0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, ball, controls;
        let velocity = new THREE.Vector3();
        let target = new THREE.Vector3();
        const speed = 0.2;
        
        const RENDER_DISTANCE = 150;
        const CHUNK_SIZE = 30;
        const TRACK_WIDTH = 20;
        const activeChunks = new Map();
        const allObjects = [];
        
        let objectCountElement, positionZElement;
        let trackMesh, leftWall, rightWall;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 50, RENDER_DISTANCE);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 60;
            controls.target.set(0, 0, 0);

            objectCountElement = document.getElementById('object-count');
            positionZElement = document.getElementById('position-z');

            setupLighting();
            createTrack();
            createBall();
            setNewTarget();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, 50, 0);
            scene.add(directionalLight);

            const pointLight1 = new THREE.PointLight(0x00ffff, 0.8, 100);
            pointLight1.position.set(TRACK_WIDTH / 2, 10, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff00ff, 0.8, 100);
            pointLight2.position.set(-TRACK_WIDTH / 2, 10, 0);
            scene.add(pointLight2);
        }

        function createTrack() {
            const trackGeometry = new THREE.PlaneGeometry(TRACK_WIDTH, RENDER_DISTANCE * 3, 1, 100);
            const trackMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a3e,
                metalness: 0.3,
                roughness: 0.8
            });
            trackMesh = new THREE.Mesh(trackGeometry, trackMaterial);
            trackMesh.rotation.x = -Math.PI / 2;
            trackMesh.position.y = -2;
            trackMesh.receiveShadow = true;
            scene.add(trackMesh);

            createTrackLines();

            const wallGeometry = new THREE.PlaneGeometry(RENDER_DISTANCE * 3, 10, 100, 1);
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a4e,
                metalness: 0.2,
                roughness: 0.7,
                side: THREE.DoubleSide
            });

            leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
            leftWall.position.set(-TRACK_WIDTH / 2 - 0.5, 3, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);

            rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
            rightWall.position.set(TRACK_WIDTH / 2 + 0.5, 3, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);
        }

        function createTrackLines() {
            const lineGroup = new THREE.Group();
            
            const centerLineGeometry = new THREE.BufferGeometry();
            const centerLineVertices = [];
            for (let z = -RENDER_DISTANCE * 1.5; z <= RENDER_DISTANCE * 1.5; z += 2) {
                centerLineVertices.push(0, -1.99, z);
                centerLineVertices.push(0, -1.99, z + 1);
            }
            centerLineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(centerLineVertices, 3));
            const centerLineMaterial = new THREE.LineBasicMaterial({ color: 0xffff00 });
            const centerLine = new THREE.LineSegments(centerLineGeometry, centerLineMaterial);
            lineGroup.add(centerLine);

            const edgeLineMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
            
            const leftEdgeGeometry = new THREE.BufferGeometry();
            const leftEdgeVertices = [];
            for (let z = -RENDER_DISTANCE * 1.5; z <= RENDER_DISTANCE * 1.5; z += 0.5) {
                leftEdgeVertices.push(-TRACK_WIDTH / 2 + 0.5, -1.99, z);
            }
            leftEdgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(leftEdgeVertices, 3));
            const leftEdge = new THREE.Line(leftEdgeGeometry, edgeLineMaterial);
            lineGroup.add(leftEdge);

            const rightEdgeGeometry = new THREE.BufferGeometry();
            const rightEdgeVertices = [];
            for (let z = -RENDER_DISTANCE * 1.5; z <= RENDER_DISTANCE * 1.5; z += 0.5) {
                rightEdgeVertices.push(TRACK_WIDTH / 2 - 0.5, -1.99, z);
            }
            rightEdgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(rightEdgeVertices, 3));
            const rightEdge = new THREE.Line(rightEdgeGeometry, edgeLineMaterial);
            lineGroup.add(rightEdge);

            scene.add(lineGroup);
        }

        function createBall() {
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x00ffff,
                metalness: 0.3,
                roughness: 0.2,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                emissive: 0x00ffff,
                emissiveIntensity: 0.3
            });
            ball = new THREE.Mesh(geometry, material);
            ball.position.y = 0;
            scene.add(ball);

            const glowGeometry = new THREE.SphereGeometry(1.6, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.1
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            ball.add(glow);
        }

        function getChunkKey(z) {
            return `${Math.floor(z / CHUNK_SIZE)}`;
        }

        function createChunkContent(chunkZ) {
            const objects = [];
            const baseZ = chunkZ * CHUNK_SIZE;

            const numObstacles = Math.floor(Math.random() * 4) + 2;
            for (let i = 0; i < numObstacles; i++) {
                const obstacleType = Math.floor(Math.random() * 4);
                let geometry, size;

                switch (obstacleType) {
                    case 0:
                        size = Math.random() * 1.5 + 0.5;
                        geometry = new THREE.BoxGeometry(size, size, size);
                        break;
                    case 1:
                        size = Math.random() * 1 + 0.5;
                        geometry = new THREE.ConeGeometry(size, size * 2, 6);
                        break;
                    case 2:
                        size = Math.random() * 0.8 + 0.4;
                        geometry = new THREE.OctahedronGeometry(size);
                        break;
                    case 3:
                        size = Math.random() * 1 + 0.5;
                        geometry = new THREE.CylinderGeometry(size * 0.5, size, size * 1.5, 8);
                        break;
                }

                const hue = Math.random();
                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, 0.8, 0.5),
                    metalness: 0.5,
                    roughness: 0.5
                });

                const obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.set(
                    (Math.random() - 0.5) * (TRACK_WIDTH - 4),
                    size / 2,
                    baseZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2
                );
                obstacle.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                obstacle.userData.isChunkObject = true;
                obstacle.userData.originalY = obstacle.position.y;
                objects.push(obstacle);
                scene.add(obstacle);
                allObjects.push(obstacle);
            }

            const numMarkers = 2;
            for (let i = 0; i < numMarkers; i++) {
                const markerGeometry = new THREE.RingGeometry(0.3, 0.5, 16);
                const markerMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff00,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.6
                });
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                marker.rotation.x = -Math.PI / 2;
                marker.position.set(
                    0,
                    -1.9,
                    baseZ + (i === 0 ? -CHUNK_SIZE / 4 : CHUNK_SIZE / 4)
                );
                marker.userData.isChunkObject = true;
                objects.push(marker);
                scene.add(marker);
                allObjects.push(marker);
            }

            return objects;
        }

        function updateChunks() {
            const ballChunkZ = Math.floor(ball.position.z / CHUNK_SIZE);
            const viewDistance = Math.ceil(RENDER_DISTANCE / CHUNK_SIZE);

            const neededChunks = new Set();
            for (let dz = -viewDistance; dz <= viewDistance; dz++) {
                const cz = ballChunkZ + dz;
                const key = `${cz}`;
                neededChunks.add(key);

                if (!activeChunks.has(key)) {
                    const objects = createChunkContent(cz);
                    activeChunks.set(key, objects);
                }
            }

            for (const [key, objects] of activeChunks) {
                if (!neededChunks.has(key)) {
                    for (const obj of objects) {
                        scene.remove(obj);
                        const index = allObjects.indexOf(obj);
                        if (index > -1) {
                            allObjects.splice(index, 1);
                        }
                        if (obj.geometry) obj.geometry.dispose();
                        if (obj.material) {
                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(m => m.dispose());
                            } else {
                                obj.material.dispose();
                            }
                        }
                    }
                    activeChunks.delete(key);
                }
            }

            objectCountElement.textContent = allObjects.length;
        }

        function updateTrack() {
            trackMesh.position.z = Math.floor(ball.position.z / (RENDER_DISTANCE * 0.5)) * (RENDER_DISTANCE * 0.5);
            leftWall.position.z = trackMesh.position.z;
            rightWall.position.z = trackMesh.position.z;
        }

        function setNewTarget() {
            target.x = (Math.random() - 0.5) * (TRACK_WIDTH - 6);
            target.y = 0;
            target.z = ball.position.z + (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 100 + 50);
        }

        function updateBall() {
            const direction = new THREE.Vector3().subVectors(target, ball.position).normalize();
            velocity.lerp(direction.multiplyScalar(speed), 0.03);
            
            velocity.x *= 0.98;
            
            ball.position.add(velocity);
            
            ball.position.x = Math.max(-TRACK_WIDTH / 2 + 2, Math.min(TRACK_WIDTH / 2 - 2, ball.position.x));
            
            ball.rotation.x += velocity.z * 0.5;
            ball.rotation.z -= velocity.x * 0.3;

            const distance = Math.abs(ball.position.z - target.z);
            if (distance < 10) {
                setNewTarget();
            }

            const hue = (Date.now() * 0.0005) % 1;
            const color = new THREE.Color().setHSL(hue, 1, 0.5);
            ball.material.color = color;
            ball.material.emissive = color;

            positionZElement.textContent = Math.round(ball.position.z);

            camera.position.x = ball.position.x * 0.3;
            camera.position.y = 8;
            camera.position.z = ball.position.z + 18;
            controls.target.set(ball.position.x, 2, ball.position.z);
        }

        function animateObjects() {
            const time = Date.now() * 0.001;
            for (const obj of allObjects) {
                if (obj.userData.isChunkObject && obj.userData.originalY !== undefined) {
                    obj.rotation.x += 0.01;
                    obj.rotation.y += 0.005;
                    obj.position.y = obj.userData.originalY + Math.sin(time * 2 + obj.position.z * 0.1) * 0.3;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let chunkUpdateTimer = 0;
        function animate() {
            requestAnimationFrame(animate);
            updateBall();
            updateTrack();
            animateObjects();
            
            chunkUpdateTimer++;
            if (chunkUpdateTimer >= 10) {
                updateChunks();
                chunkUpdateTimer = 0;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
